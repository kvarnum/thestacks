<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks — Media Library</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Work+Sans:wght@400;600&family=Montserrat:wght@600;700&display=swap">
<style>
  :root{
    --bg:#050a10;
    --bg-elevated:#0d1b2a;
    --card:#384450;
    --card-hover:#505a65;
    --border:#2a3643;
    --text:#f2ede3;
    --text-muted:#b7a58a;
    --text-faint:#5a6570;
    --accent:#b86a3a;
    --accent-dim:#774425;
    --accent-hover:#c78a65;
    --amber:#d4a544;
    --blue:#6e8fb0;
    --red:#b0475c;
    --teal:#5fa88c;
    --serif: 'Josefin Sans', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --brand: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim);color:var(--text);}
  a{color:var(--accent);}

  .app{max-width:1400px;margin:0 auto;padding:28px 24px 80px;}

  /* Header */
  header.top{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:16px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
    margin-bottom:20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:20px;
  }
  #splashScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity 0.65s ease;
  }
  #splashScreen.splash-hide{
    opacity:0;
    pointer-events:none;
  }
  .splash-badge-wrap{
    position:relative;
    width:150px;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .splash-badge{
    width:130px;
    height:130px;
    opacity:0;
    transform:scale(2.2);
    transition:opacity 0.2s ease, transform 0.45s cubic-bezier(.2,.9,.3,1);
  }
  .splash-trace-ring{
    position:absolute;
    inset:0;
    width:150px;
    height:150px;
  }
  .splash-trace-ring circle{
    transition:stroke-dashoffset 1.4s ease;
  }
  .splash-word{
    margin-top:16px;
    font-family:var(--brand);
    font-weight:600;
    letter-spacing:0.22em;
    color:var(--text);
    font-size:15px;
    opacity:0;
    transition:opacity 0.8s ease;
  }
  .brand-badge{
    flex-shrink:0;
    width:128px;
    height:128px;
    border-radius:50%;
    background:var(--bg-elevated);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:width 0.25s ease, height 0.25s ease;
  }
  .brand-icon{
    display:block;
    height:122px;
    width:auto;
    transition:height 0.25s ease;
  }
  .brand-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }
  .brand-divider{
    width:1px;
    align-self:stretch;
    background:var(--accent);
    flex-shrink:0;
    margin:2px 4px;
  }
  .brand-line{
    height:1px;
    width:30px;
    background:var(--accent-dim);
    flex-shrink:0;
  }
  .brand-icons-row{
    display:flex;
    gap:22px;
    flex-shrink:0;
  }
  .brand-icon-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:var(--text);
  }
  .brand-icon-item span{
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .brand-text h1{
    font-family:var(--brand);
    font-size:46px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0;
    line-height:1;
    color:var(--text);
    white-space:nowrap;
    transition:font-size 0.25s ease;
  }
  .brand-subtitle{
    margin:8px 0 0;
    color:var(--accent);
    font-size:14px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-align:center;
  }
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  @keyframes contentFadeIn{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }
  .content-fade{
    animation:contentFadeIn 0.2s ease;
  }

  input[type="text"], input[type="number"], input[type="url"], select, textarea{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:var(--sans);
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .search-wrap{position:relative;flex:1;}
  .search-wrap input{width:100%;padding-left:34px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;}
  .gear-btn{
    position:relative;
    width:38px;
    height:38px;
    border-radius:8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    cursor:pointer;
    flex-shrink:0;
  }
  .gear-btn:hover{color:var(--text);border-color:var(--accent-dim);}
  .gear-menu{
    position:absolute;
    top:44px;
    right:0;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px;
    min-width:160px;
    z-index:30;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
  }
  .gear-menu div{
    padding:8px 10px;
    font-size:13px;
    color:var(--text);
    border-radius:6px;
    cursor:pointer;
  }
  .gear-menu div:hover{background:var(--card-hover);}

  button{
    font-family:var(--sans);
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg-elevated);
    color:var(--text);
    padding:10px 16px;
    font-size:14px;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  button:hover{background:var(--card-hover);border-color:var(--accent-dim);}
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#ffffff;
    font-weight:600;
  }
  button.primary:hover{background:var(--accent-hover);}
  button.ghost{background:transparent;border-color:transparent;color:var(--text-muted);}
  button.ghost:hover{background:var(--bg-elevated);color:var(--text);}
  button.danger{color:var(--red);}
  button:disabled{opacity:0.5;cursor:not-allowed;}

  /* Category tabs */
  .category-tabs{
    display:flex;
    gap:20px;
    margin-bottom:22px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .category-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    padding:10px 2px;
    font-size:14px;
    color:var(--text-muted);
    cursor:pointer;
    position:relative;
    top:1px;
    border-bottom:2px solid transparent;
    user-select:none;
    white-space:nowrap;
    flex-shrink:0;
  }
  .cat-tab:hover{color:var(--text);}
  .cat-tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}
  .tabIcon{margin-right:5px;vertical-align:-2px;}
  @keyframes tabIconSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .anim-spin{animation:tabIconSpin 0.5s ease;display:inline-block;}
  .stats-row-wrap{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;}
  .stats-row-right{display:flex;align-items:center;gap:10px;}
  .enrich-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:var(--text-muted);
    padding:4px 10px;
    border-radius:6px;
    border:1px solid var(--border);
  }
  .enrich-chip .mini-track{
    width:60px;
    height:4px;
    border-radius:2px;
    background:var(--border);
    overflow:hidden;
  }
  .enrich-chip .mini-fill{
    height:100%;
    background:var(--accent);
  }
  .enrich-chip button{
    padding:2px 8px;
    font-size:10px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    text-decoration:underline;
    cursor:pointer;
  }
  .enrich-chip button:hover{color:var(--text);background:transparent;}
  .stats-toggle{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    color:var(--text-muted);
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid var(--border);
    user-select:none;
  }
  .stats-toggle:hover{color:var(--text);}
  .stats-toggle .chev{transition:transform 0.2s ease;display:inline-block;}
  .stats-toggle.open .chev{transform:rotate(180deg);}

  /* Stats strip */
  .stats{
    display:flex;
    gap:0;
    margin-bottom:20px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-elevated);
  }
  .stat{
    flex:1;
    padding:14px 18px;
    border-right:1px solid var(--border);
  }
  .stat:last-child{border-right:none;}
  .stat .num{font-family:var(--sans);font-weight:600;font-size:26px;color:var(--accent);line-height:1;}
  .stat .label{font-size:12px;color:var(--text-muted);margin-top:4px;}

  /* Filter row */
  .filters{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-elevated);
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#ffffff;
    font-weight:600;
  }
  .sort-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-muted);font-size:13px;}

  .enrich-bar{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bg-elevated);
    border:1px solid var(--accent-dim);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:20px;
    font-size:13px;
    color:var(--text-muted);
  }
  .enrich-bar .track{
    flex:1;
    height:6px;
    background:var(--bg);
    border-radius:4px;
    overflow:hidden;
  }
  .enrich-bar .fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width 0.3s ease;
  }

  /* Grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:18px;
  }
  .view-toggle{
    display:flex;
    gap:2px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:2px;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    padding:6px 14px;
    font-size:13px;
    border-radius:6px;
  }
  .view-toggle button.active{
    background:var(--accent);
    color:#ffffff;
    font-weight:600;
  }
  .row-mode-pills{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .media-row{margin-bottom:24px;}
  .media-row-label{
    font-family:var(--serif);
    font-size:16px;
    color:var(--accent);
    margin-bottom:10px;
  }
  .media-row-scroll-wrap{
    position:relative;
  }
  .media-row-scroll-wrap::after{
    content:'';
    position:absolute;
    top:0;
    right:0;
    bottom:8px;
    width:44px;
    background:linear-gradient(to right, transparent, var(--bg));
    pointer-events:none;
  }
  .media-row-strip{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:8px;
    scroll-snap-type:x proximity;
  }
  .media-row-strip .poster-card{
    flex:0 0 130px;
    scroll-snap-align:start;
  }
  .poster-card{
    cursor:pointer;
    position:relative;
    transition:transform 0.15s ease;
  }
  .poster-card:hover{
    transform:scale(1.05);
    z-index:2;
  }
  .poster-art{
    aspect-ratio:2/3;
    border-radius:8px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .poster-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .poster-placeholder{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:14px;
    text-align:center;
    background:linear-gradient(160deg, var(--card), var(--bg-elevated));
  }
  .poster-placeholder .initial{
    font-family:var(--serif);
    font-size:32px;
    color:var(--accent-dim);
    margin-bottom:8px;
  }
  .poster-placeholder .ttl{
    font-size:12px;
    color:var(--text-muted);
    line-height:1.3;
  }
  .poster-card:hover .poster-art{border-color:var(--accent-dim);}
  .poster-meta{
    margin-top:8px;
  }
  .poster-meta .t{
    font-size:13px;
    font-weight:600;
    line-height:1.3;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .poster-meta .y{
    font-size:12px;
    color:var(--text-faint);
    margin-top:2px;
  }
  .fmt-dots{
    position:absolute;
    bottom:6px;
    left:6px;
    display:flex;
    gap:4px;
  }
  .fmt-dot{
    width:9px;height:9px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4);
  }

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--text-muted);
  }
  .empty-state h2{font-family:var(--serif);color:var(--text);font-weight:600;}
  .empty-state-lines{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:10px;
  }
  .empty-state-lines h2{margin:0;}
  .empty-state-warm p{margin-bottom:20px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(8,9,12,0.72);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal{
    position:relative;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:14px;
    max-width:640px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:0;
    transform:scale(0.92);
    opacity:0;
    transition:transform 0.22s ease, opacity 0.22s ease;
  }
  .modal.modal-visible{
    transform:scale(1);
    opacity:1;
  }
  .modal.modal-detail{
    transform:scale(0.9) translateY(18px);
    transition:transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }
  .modal.modal-detail.modal-visible{
    transform:scale(1) translateY(0);
  }
  .modal-head{
    display:flex;
    gap:20px;
    padding:24px 24px 0;
  }
  .modal-poster{
    width:110px;
    flex-shrink:0;
    aspect-ratio:2/3;
    border-radius:8px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
  }
  .modal-poster img{width:100%;height:100%;object-fit:cover;}
  .detail-hero{
    position:relative;
    width:100%;
    height:420px;
    overflow:hidden;
    border-radius:14px 14px 0 0;
    background:linear-gradient(160deg, var(--card), var(--bg-elevated));
  }
  .detail-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .detail-hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(0deg, var(--bg-elevated) 0%, transparent 65%);
  }
  .detail-hero-text{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:1;
    padding:20px 24px;
  }
  .detail-hero-text h2{
    font-family:var(--serif);
    font-size:28px;
    font-weight:700;
    margin:0 0 4px;
    color:var(--text);
    line-height:1.15;
  }
  .detail-hero-text .sub{
    font-size:13px;
    color:var(--text-muted);
  }
  .detail-close{
    position:absolute;
    top:12px;
    right:12px;
    z-index:3;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(10,10,12,0.6);
    border:none;
    color:var(--text);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-title-wrap{flex:1;min-width:0;}
  .modal-title-wrap h2{
    font-family:var(--serif);
    font-size:24px;
    margin:0 0 4px;
    line-height:1.15;
  }
  .modal-title-wrap .sub{color:var(--text-muted);font-size:13px;}
  .modal-body{padding:20px 24px 24px;}
  .field-row{margin-bottom:14px;}
  .detail-row{margin-bottom:16px;}
  .detail-label{
    display:block;
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .detail-value{
    font-size:14px;
    color:var(--text);
    line-height:1.6;
  }
  .detail-value.not-filled{
    color:var(--text-faint);
    font-style:italic;
  }
  .detail-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:6px;
  }
  .detail-chip{
    display:inline-flex;
    align-items:center;
    margin-right:14px;
    margin-bottom:4px;
  }
  .field-row label{
    display:block;
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:5px;
  }
  .field-row input, .field-row textarea{width:100%;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fmt-checks{display:flex;gap:10px;flex-wrap:wrap;}
  .fmt-check{
    display:flex;align-items:center;gap:6px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    color:var(--text-muted);
  }
  .fmt-check.checked{border-color:var(--accent-dim);color:var(--text);background:rgba(76,142,240,0.12);}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .modal-actions .right{display:flex;gap:8px;}
  .close-x{
    position:sticky;top:0;float:right;margin:14px 14px 0 0;
    background:transparent;border:none;color:var(--text-muted);font-size:20px;line-height:1;
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--accent-dim);
    color:var(--text);padding:12px 20px;border-radius:8px;
    font-size:13px;z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }

  @media (max-width:640px){
    .brand-badge{width:76px;height:76px;}
    .brand-icon{height:72px;}
    .brand-line{width:16px;}
    .brand-divider, .brand-icons-row{display:none;}
    .brand-text h1{font-size:34px;}
    .brand-subtitle{font-size:11px;}
    .search-wrap input{width:160px;}
    .stats{flex-wrap:wrap;}
    .stat{flex:1 1 45%;border-bottom:1px solid var(--border);}
    .field-grid{grid-template-columns:1fr;}
    .modal-head{flex-direction:column;}
    .modal-poster{width:100px;}
    .category-tabs{gap:9px;overflow-x:auto;}
    .tabIcon{margin-right:4px;}

const FORMAT_FALLBACK_PALETTE = ['#8a6fb0','#c97a4a','#4c8ef0','#7a9e4a','#b0a0d0','#4aa0a8','#c96e8f','#6ab08a','#a88a4a','#7a8fc9'];
function getFormatColor(fmt){
  if(FORMAT_COLOR_MAP[fmt]) return FORMAT_COLOR_MAP[fmt];
  let hash = 0;
  for(let i=0;i<fmt.length;i++){ hash = (hash*31 + fmt.charCodeAt(i)) >>> 0; }
  return FORMAT_FALLBACK_PALETTE[hash % FORMAT_FALLBACK_PALETTE.length];
}

function getChipField(config){

// The pill row and dropdowns are a separate concern from getChipField above (which
// drives the poster dots and stats breakdown, and should keep reflecting whichever
// field came first — Console for Games — regardless of filter-UI presentation).
// Here, whichever checkboxes field has the fewest options becomes clickable pills;
// any other checkboxes field is filtered via a dropdown instead, since a long list
// (like Video Games' 15 consoles) doesn't work well as a row of pills.
function getPillFilterField(config){
  const checkboxFields = config.fields.filter(f=>f.type==='checkboxes');
  if(checkboxFields.length === 0) return null;
  return checkboxFields.slice().sort((a,b)=>a.options.length-b.options.length)[0];
}

function getDropdownCheckboxFields(config){
  const pillField = getPillFilterField(config);
  return config.fields.filter(f=>f.type==='checkboxes' && f !== pillField);
}

// Uses Claude's artifact storage when available (inside this chat), and falls back to
// the browser's own localStorage otherwise (e.g. once hosted as a standalone page) —
// so the exact same file works correctly in both places without any changes.
const storage = {
  async get(key, shared){
    if(window.storage && typeof window.storage.get === 'function'){
      try{ return await window.storage.get(key, shared); } catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem(key);
      return raw === null ? null : { key, value: raw, shared: !!shared };
    } catch(e){ return null; }
  },
  async set(key, value, shared){
    if(window.storage && typeof window.storage.set === 'function'){
      try{ return await window.storage.set(key, value, shared); } catch(e){ /* fall through */ }
    }
    try{
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    } catch(e){ return null; }
  }
};

async function loadLibrary(){
  try{
    const result = await storage.get('library', false);
    if(result && result.value){
      state.items = JSON.parse(result.value);
    } else {
      let migrated = null;
      try{
        const old = await storage.get('movies', false);
        if(old && old.value){
          migrated = JSON.parse(old.value).map(m => ({...m, category:'Movie'}));
        }
      } catch(e){ /* no old data */ }
      state.items = migrated || seedMovies();
      await saveLibrary();
    }
  } catch(e){
    state.items = seedMovies();
    await saveLibrary();
  }
  const fixed = fixDataIssues();
  const tvMerged = await mergeTvSeedOnce();
  if(fixed || tvMerged) await saveLibrary();
  render();
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Defensively coerces a tags-type field's stored value into an array. Needed because
// 'series' used to be a plain text field — existing saved items may still have a raw
// string there until the user re-saves them, and a bare string has no .join/.includes
// the way an array does.
function toArray(val){
  if(Array.isArray(val)) return val;
  if(typeof val === 'string' && val.trim()) return val.split(',').map(s=>s.trim()).filter(Boolean);
  return [];
}

function sortableTitle(title){

const SURNAME_PARTICLES = new Set(['le','la','de','van','von','del','della','di','da','du','des','dos','das','mac','mc']);

function creatorLastName(name){
  if(!name) return '';
  const firstName = name.split(',')[0].trim(); // if multiple people are listed, sort by the first
  const parts = firstName.split(/\s+/).filter(Boolean);
  if(!parts.length) return '';
  if(parts.length >= 2 && SURNAME_PARTICLES.has(parts[parts.length - 2].toLowerCase())){
    return parts.slice(-2).join(' ');
  }
  return parts[parts.length - 1];
}

function getFiltered(){
  const config = CATEGORY_CONFIG[state.activeCategory];
  const pillField = getPillFilterField(config);
  let list = currentItems();
  if(pillField && state.activeFilter !== 'All'){
    list = list.filter(m => (m[pillField.key]||[]).includes(state.activeFilter));
  }
  getDropdownCheckboxFields(config).forEach(f => {
    const val = state.checkboxFilters[f.key];
    if(val && val !== 'All'){
      list = list.filter(m => (m[f.key]||[]).includes(val));
    }
  });
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const searchable = config.fields.filter(f=>['text','tags','select'].includes(f.type));
    list = list.filter(m => searchable.some(f=>{
      const v = m[f.key];
      if(f.type==='tags') return toArray(v).join(' ').toLowerCase().includes(q);
      return (v||'').toString().toLowerCase().includes(q);
    }));
  }
  if(state.genreFilter && state.genreFilter !== 'All'){
    list = list.filter(m => (m.genre||[]).includes(state.genreFilter));
  }
  if(state.sortBy === 'title'){
    list.sort((a,b)=>sortableTitle(a.title).localeCompare(sortableTitle(b.title)));
  } else if(state.sortBy === 'year-desc'){
    list.sort((a,b)=>(b.year||0)-(a.year||0));
  } else if(state.sortBy === 'year-asc'){
    list.sort((a,b)=>(a.year||0)-(b.year||0));
  } else if(state.sortBy === 'recent'){
    list.sort((a,b)=>(state.items.indexOf(b)) - (state.items.indexOf(a)));
  } else if(state.sortBy === 'creator-lastname' && config.creatorField){
    list.sort((a,b)=>creatorLastName(a[config.creatorField]).localeCompare(creatorLastName(b[config.creatorField])));
  }
  return list;
}

function availableRowModes(){
  const config = CATEGORY_CONFIG[state.activeCategory];
  const items = currentItems();
  const modes = [];
  if(items.length) modes.push('az');
  if(config.fields.some(f=>f.key==='genre') && items.some(m=>(m.genre||[]).length)) modes.push('genre');
  if(config.fields.some(f=>f.key==='series') && items.some(m=>toArray(m.series).length)) modes.push('collection');
  if(config.creatorField && items.some(m=>m[config.creatorField] && m[config.creatorField].trim())) modes.push('creator');
  return modes;
}

function getGroupedRows(){
  const config = CATEGORY_CONFIG[state.activeCategory];
  let list = currentItems();
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const searchable = config.fields.filter(f=>['text','tags','select'].includes(f.type));
    list = list.filter(m => searchable.some(f=>{
      const v = m[f.key];
      if(f.type==='tags') return toArray(v).join(' ').toLowerCase().includes(q);
      return (v||'').toString().toLowerCase().includes(q);
    }));
  }

  const groups = {};
  const order = [];
  const addTo = (key, item) => {
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(item);
  };

  if(state.rowMode === 'genre'){
    list.forEach(m => (m.genre||[]).forEach(g => addTo(g, m)));
    order.sort((a,b)=>a.localeCompare(b));
  } else if(state.rowMode === 'collection'){
    list.forEach(m => toArray(m.series).forEach(s => addTo(s, m)));
    order.sort((a,b)=>sortableTitle(a).localeCompare(sortableTitle(b)));
  } else if(state.rowMode === 'creator'){
    list.forEach(m => {
      const name = m[config.creatorField];
      if(name && name.trim()) addTo(creatorLastName(name), m);
    });
    order.sort((a,b)=>a.localeCompare(b));
  } else {
    list.forEach(m => {
      const firstChar = sortableTitle(m.title)[0] || '';
      const key = /[0-9]/.test(firstChar) ? '#' : (firstChar ? firstChar.toUpperCase() : '#');
      addTo(key, m);
    });
    order.sort((a,b) => {
      if(a === '#') return -1;
      if(b === '#') return 1;
      return a.localeCompare(b);
    });
  }

  return order.map(label => {
    const items = groups[label].slice();
    if(state.rowMode === 'collection'){
      items.sort((a,b)=>(a.year||0)-(b.year||0));
    } else {
      items.sort((a,b)=>sortableTitle(a.title).localeCompare(sortableTitle(b.title)));
    }
    return {label, items};
  });
}

function setViewMode(mode){
  state.viewMode = mode;
  if(mode === 'rows' && !availableRowModes().includes(state.rowMode)){
    state.rowMode = availableRowModes()[0] || 'az';
  }
  render();
}
function setRowMode(mode){ state.rowMode = mode; render(); }

function getAllGenres(){
  const set = new Set();
  currentItems().forEach(m => (m.genre||[]).forEach(g => set.add(g)));
  return Array.from(set).sort();
}

function computeStats(){
  const config = CATEGORY_CONFIG[state.activeCategory];
  const chipField = getChipField(config);
  const items = currentItems();
  const total = items.length;
  const counts = {};
  if(chipField) chipField.options.forEach(o => counts[o] = 0);
  items.forEach(m=>{
    if(chipField) (m[chipField.key]||[]).forEach(o=>{ if(counts[o]!==undefined) counts[o]++; });
  });
  const years = items.map(m=>m.year).filter(Boolean);
  const enrichedCount = items.filter(m=>m.enriched).length;
  return {total, counts, chipField, minYear: years.length?Math.min(...years):null, maxYear: years.length?Math.max(...years):null, enrichedCount};
}

function posterCardHtml(m){
  const config = CATEGORY_CONFIG[m.category];
  const chipField = getChipField(config);
  const artInner = m.coverUrl
    ? `<img src="${escapeHtml(m.coverUrl)}" alt="${escapeHtml(m.title)}" onerror="this.parentElement.innerHTML=window.placeholderHtml('${m.id}')">`
    : placeholderHtml(m.id);
  const dots = chipField
    ? (m[chipField.key]||[]).slice().sort((a,b)=>chipField.options.indexOf(a)-chipField.options.indexOf(b))
        .map(f=>`<span class="fmt-dot" style="background:${getFormatColor(f)}" title="${escapeHtml(f)}"></span>`).join('')
    : '';
  const subtitleVal = m[config.subtitleField];
  return `
    <div class="poster-card" onclick="openDetailView('${m.id}')">
      <div class="poster-art" style="aspect-ratio:${config.aspect};">
        ${artInner}
        <div class="fmt-dots">${dots}</div>
      </div>
      <div class="poster-meta">
        <div class="t">${escapeHtml(m.title)}</div>
        <div class="y">${m.year||''}${subtitleVal ? ', ' + escapeHtml(subtitleVal) : ''}</div>
      </div>
    </div>
  `;
}

function placeholderHtml(id){
  const m = state.items.find(x=>x.id===id);
  if(!m) return '';
  const initial = m.title ? sortableTitle(m.title)[0].toUpperCase() : '?';
  return `<div class="poster-placeholder"><div class="initial">${escapeHtml(initial)}</div><div class="ttl">${escapeHtml(m.title)}</div></div>`;
}
window.placeholderHtml = placeholderHtml;

function heroPlaceholderHtml(id){
  const m = state.items.find(x=>x.id===id);
  if(!m) return '';
  const initial = m.title ? sortableTitle(m.title)[0].toUpperCase() : '?';
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--card),var(--bg-elevated));"><span style="font-family:var(--serif);font-size:72px;color:var(--accent-dim);">${escapeHtml(initial)}</span></div>`;
}

function searchHintFor(config){
  const extras = config.fields.filter(f=>['text','tags'].includes(f.type) && f.key!=='title').slice(0,2);
  const parts = ['title', ...extras.map(f=>f.label.toLowerCase())];
  return 'Search ' + parts.join(', ');
}

async function handleImportFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const looksValid = Array.isArray(parsed) && parsed.every(x => x && typeof x === 'object' && x.id && x.category);
    if(!looksValid){
      showToast("That file doesn't look like a Stacks export");
      fileInput.value = '';
      return;
    }
    const wantsMerge = confirm(`Add these ${parsed.length} items to your existing library of ${state.items.length}, keeping everything you already have?\n\nClick Cancel instead to fully replace your library with just this file.`);
    if(wantsMerge){
      // Guard against the rare case of an id collision with something already in the
      // library — regenerate just that item's id rather than let one overwrite the other.
      const existingIds = new Set(state.items.map(m=>m.id));
      const toAdd = parsed.map((item, i) => existingIds.has(item.id) ? {...item, id: `i${Date.now()}_${i}`} : item);
      state.items = [...state.items, ...toAdd];
      await saveLibrary();
      render();
      showToast(`Added ${parsed.length} items to your library`);
    } else {
      const proceedReplace = confirm(`Replace your ENTIRE library of ${state.items.length} items with just these ${parsed.length}? This can't be undone.`);
      if(!proceedReplace){ fileInput.value = ''; return; }
      state.items = parsed;
      await saveLibrary();
      render();
      showToast(`Imported ${parsed.length} items`);
    }
  } catch(e){
    console.error('import failed', e);
    showToast("Could not read that file — make sure it's a Stacks export");
  }
  fileInput.value = '';
}

function saveModal(){
  const category = editingId ? (state.items.find(m=>m.id===editingId).category) : state.activeCategory;
  const config = CATEGORY_CONFIG[category];
  const payload = {};
  config.fields.forEach(field=>{
    const key = field.key;
    const el = document.getElementById(`f-${key}`);
    if(field.type==='text' || field.type==='url' || field.type==='textarea'){
      payload[key] = el.value.trim();
    } else if(field.type==='number'){
      payload[key] = parseInt(el.value) || null;
    } else if(field.type==='tags'){
      const raw = el.value.trim();
      payload[key] = raw ? raw.split(',').map(s=>s.trim()).filter(Boolean) : [];
    } else if(field.type==='checkboxes'){
      payload[key] = Array.from(el.querySelectorAll('.fmt-check.checked')).map(x=>x.dataset.fmt);
    } else if(field.type==='select'){
      const sel = el.querySelector('.fmt-check.checked');
      payload[key] = sel ? sel.dataset.fmt : '';
    }
  });
  if(!payload.title){ showToast('Give it a title first'); return; }

  const mainKey = config.enrichKeys[0];
  const mainVal = payload[mainKey];
  const enriched = !!(payload.coverUrl && mainVal && (Array.isArray(mainVal) ? mainVal.length>0 : true));

  if(editingId){
    const idx = state.items.findIndex(m=>m.id===editingId);
    if(idx>-1){
      state.items[idx] = {...state.items[idx], ...payload};
    }
    saveLibrary();
    render();
    showToast('Saved');
    if(idx>-1) renderDetailView(state.items[idx]);
  } else {
    const id = 'i' + Date.now();
    state.items.push({id, category, ...payload, enriched});
    saveLibrary();
    closeModal();
    render();
    showToast('Added to your library');
  }
}

}

/* ---------- Enrichment via Claude API + web search ---------- */

function extractJsonObject(raw){
  let text = raw.replace(/```json|```/g, '').trim();
  // normalize typographic quotes that sometimes sneak into model output
  text = text.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");

  const start = text.indexOf('{');
  if(start === -1) throw new Error('no json object found');

  // walk forward tracking string state so braces inside string values don't confuse the count
  let depth = 0, inString = false, escaped = false, end = -1;
  for(let i = start; i < text.length; i++){
    const ch = text[i];
    if(inString){
      if(escaped){ escaped = false; }
      else if(ch === '\\'){ escaped = true; }
      else if(ch === '"'){ inString = false; }
    } else {
      if(ch === '"'){ inString = true; }
      else if(ch === '{'){ depth++; }
      else if(ch === '}'){ depth--; if(depth === 0){ end = i; break; } }
    }
  }
  if(end === -1) throw new Error('unbalanced json object');

  let candidate = text.slice(start, end + 1);
  // drop trailing commas before a closing bracket/brace, a common small model slip
  candidate = candidate.replace(/,(\s*[}\]])/g, '$1');

  return JSON.parse(candidate);
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function readFullBody(response){
  // Prefer manually draining the stream over response.text() — some sandboxed
  // fetch implementations have shown bugs where .text() resolves before every
  // chunk has actually arrived. Reading the stream ourselves and concatenating
  // decoded chunks sidesteps that shortcut entirely.
  if(response.body && typeof response.body.getReader === 'function'){
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let result = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      if(value) result += decoder.decode(value, {stream:true});
    }
    result += decoder.decode();
    return result;
  }
  return await response.text();
}

// Adaptive pacing between lookups. Starts modest and backs off automatically
// whenever the API signals we're going too fast, instead of hammering it at
// a fixed rate regardless of how it's responding.
let enrichDelayMs = 700;
function slowDown(){ enrichDelayMs = Math.min(enrichDelayMs * 1.8, 15000); }
function speedUpSlightly(){ enrichDelayMs = Math.max(700, enrichDelayMs * 0.92); }

async function fetchFieldBatch(item, keysBatch, attempt){
  attempt = attempt || 0;
  const config = CATEGORY_CONFIG[item.category];
  const subjectDesc = `the ${SUBJECT_NOUN[item.category]} "${item.title}"${item.category==='TV' && item.season ? ` ${item.season}` : ''}${item.year?` (${item.year})`:''}`;
  const fieldDescs = keysBatch.map(k=>config.fields.find(f=>f.key===k));
  const askParts = fieldDescs.map(f=>{
    if(f.key === 'coverUrl'){
      return `a direct, hotlink-safe URL to a cover or box art image — if the best image is on Wikipedia or Wikimedia Commons you MUST use its thumbnail URL (path containing "/thumb/", ending with a width-prefixed filename such as ".../thumb/a/ab/Example.jpg/320px-Example.jpg"), never a full-resolution original, since those are blocked from being embedded elsewhere and won't display; if no safely embeddable image exists, return an empty string`;
    }
    return f.type==='tags' ? `1-3 ${f.label.toLowerCase()}` : `the ${f.label.toLowerCase()}`;
  });
  const shapeParts = fieldDescs.map(f=> f.type==='tags' ? `"${f.key}": ["value1","value2"]` : `"${f.key}": "string"`);

  const prompt = `Look up ${subjectDesc}. Search the web to find just this: ${askParts.join(', ')}. Respond with ONLY a JSON object, no other text, no markdown fences, in exactly this shape: {${shapeParts.join(', ')}}`;

  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content: prompt}],
        tools: [{type:"web_search_20250305", name:"web_search", max_uses: 1}]
      })
    });
  } catch(networkErr){
    if(attempt < 3){ await sleep(1000 * Math.pow(2, attempt)); return fetchFieldBatch(item, keysBatch, attempt+1); }
    throw new Error('network error reaching the lookup service');
  }

  if(response.status === 429){
    slowDown();
    if(attempt < 3){
      let waitMs = enrichDelayMs * 2;
      try{
        const retryAfter = response.headers && response.headers.get && response.headers.get('retry-after');
        if(retryAfter){ waitMs = Math.max(waitMs, parseFloat(retryAfter) * 1000); }
      } catch(e){ /* headers not readable in this environment, fall back to computed wait */ }
      await sleep(waitMs);
      return fetchFieldBatch(item, keysBatch, attempt+1);
    }
    throw new Error(`lookup request failed (HTTP 429): still rate-limited after repeated retries`);
  }

  if(!response.ok){
    const retryable = response.status >= 500;
    if(retryable && attempt < 3){
      await sleep(1000 * Math.pow(2, attempt));
      return fetchFieldBatch(item, keysBatch, attempt+1);
    }
    let detail = '';
    try{ detail = (await response.text()).slice(0,200); } catch(e){}
    throw new Error(`lookup request failed (HTTP ${response.status})${detail?': '+detail:''}`);
  }

  speedUpSlightly();

  let bodyText;
  try{
    bodyText = await readFullBody(response);
  } catch(e){
    if(attempt < 3){ await sleep(1000 * Math.pow(2, attempt)); return fetchFieldBatch(item, keysBatch, attempt+1); }
    throw new Error('could not read the lookup response');
  }

  if(!bodyText || !bodyText.trim()){
    // an OK status with a completely empty body is its own distinct failure — likely a
    // dropped/cancelled request the proxy still reported as successful. Worth a few retries.
    if(attempt < 4){ await sleep(800 * Math.pow(2, attempt)); return fetchFieldBatch(item, keysBatch, attempt+1); }
    throw new Error(`lookup returned a completely empty response body (HTTP ${response.status}) after retries`);
  }

  let data;
  try{
    data = JSON.parse(bodyText);
  } catch(e){
    // an OK status with an unparsable body most often means the response was still mid-stream
    // when we read it — a timing race, not a permanent failure, so it's worth several retries
    // with a bit of a pause to let the transfer finish before trying again.
    if(attempt < 4){ await sleep(700 + 600 * attempt); return fetchFieldBatch(item, keysBatch, attempt+1); }
    throw new Error(`lookup response was not valid JSON: ${bodyText.slice(0,150)}`);
  }

  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
  const raw = textBlocks.join('\n').trim();
  if(!raw) throw new Error('empty response from lookup');
  return extractJsonObject(raw);
}

function getEnrichBatches(keys){
  const batches = [];
  const chunkSize = 1;
  for(let i=0; i<keys.length; i+=chunkSize){
    batches.push(keys.slice(i, i+chunkSize));
  }
  return batches;
}

/* ---------- ISBN lookup (Google Books) and camera barcode scanning ---------- */

async function lookupByIsbn(){
  const isbnInput = document.getElementById('f-isbn');
  if(!isbnInput) return;
  const isbn = isbnInput.value.trim().replace(/[\s-]/g, '');
  if(!isbn){ showToast('Enter an ISBN first'); return; }
  showToast('Looking up ISBN…');
  try{
    const result = await fetchGoogleBooksDetails({ isbn });
    if(!result.title && !result.author && !result.publisher && !result.coverUrl){
      showToast('No book found for that ISBN');
      return;
    }
    const setVal = (id, v) => { const el = document.getElementById(id); if(el && v !== undefined && v !== null && v !== '') el.value = v; };
    setVal('f-title', result.title);
    setVal('f-year', result.year);
    setVal('f-author', result.author);
    setVal('f-publisher', result.publisher);
    setVal('f-genre', (result.genre||[]).join(', '));
    setVal('f-coverUrl', result.coverUrl);
    setVal('f-overview', result.overview);
    setVal('f-pageCount', result.pageCount);
    setVal('f-goodreadsRating', result.goodreadsRating);
    showToast('Filled in from Google Books — review before saving');
  } catch(e){
    console.error('ISBN lookup failed', e);
    const detail = (e && e.message) ? e.message : String(e);
    showToast(`Could not look up that ISBN — ${detail.slice(0,150)}`, 8000);
  }
}

let activeBarcodeReader = null;
let barcodeHandled = false;

function loadZxingScript(){
  return new Promise((resolve, reject) => {
    if(typeof ZXingBrowser !== 'undefined'){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/@zxing/browser@latest';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('failed to load the barcode scanner library'));
    document.head.appendChild(script);
  });
}

async function openBarcodeScanner(){
  barcodeHandled = false;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'barcode-overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeBarcodeScanner(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <button class="close-x" onclick="closeBarcodeScanner()">×</button>
      <div class="modal-body" style="padding-top:50px; text-align:center;">
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:12px;">Point your camera at the barcode on the back of the book.</p>
        <video id="barcode-video" style="width:100%; border-radius:8px; background:#000;" playsinline muted></video>
        <p id="barcode-status" style="color:var(--text-muted); font-size:12px; margin-top:10px;">Starting camera…</p>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const showModal = () => {
    const modalEl = overlay.querySelector('.modal');
    if(modalEl) modalEl.classList.add('modal-visible');
  };
  if(typeof requestAnimationFrame === 'function'){ requestAnimationFrame(showModal); } else { setTimeout(showModal, 16); }

  try{
    await loadZxingScript();
    const videoEl = document.getElementById('barcode-video');
    const statusEl = document.getElementById('barcode-status');
    activeBarcodeReader = new ZXingBrowser.BrowserMultiFormatReader();
    const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    const rearCamera = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length-1];
    activeBarcodeReader.decodeFromVideoDevice(rearCamera ? rearCamera.deviceId : undefined, videoEl, (result, err) => {
      // The camera keeps feeding frames to this callback continuously, so the same
      // barcode can trigger it several times in the instant before the reader actually
      // stops — without this guard, each of those extra firings kicked off its own
      // Google Books lookup on top of the one already running, which is what made the
      // scanner appear to hang.
      if(result && !barcodeHandled){
        barcodeHandled = true;
        const isbn = result.getText();
        if(statusEl) statusEl.textContent = 'Found: ' + isbn;
        closeBarcodeScanner();
        const isbnInput = document.getElementById('f-isbn');
        if(isbnInput){
          isbnInput.value = isbn;
          lookupByIsbn();
        }
      }
    });
  } catch(e){
    console.error('barcode scanner failed to start', e);
    const statusEl = document.getElementById('barcode-status');
    if(statusEl) statusEl.textContent = 'Could not access the camera — enter the ISBN manually instead.';
  }
}

function closeBarcodeScanner(){
  barcodeHandled = true;
  if(activeBarcodeReader){
    try{ activeBarcodeReader.reset(); } catch(e){ /* already stopped */ }
    activeBarcodeReader = null;
  }
  const overlay = document.getElementById('barcode-overlay');
  if(overlay) overlay.remove();
}

async function tmdbRequest(url, attempt){
  attempt = attempt || 0;
  let response;
  try{
    response = await fetch(url, {
      headers: {
        'Authorization': `Bearer ${TMDB_ACCESS_TOKEN}`,
        'accept': 'application/json'
      }
    });
  } catch(networkErr){
    if(attempt < 2){ await sleep(1000 * Math.pow(2, attempt)); return tmdbRequest(url, attempt+1); }
    throw new Error(`network error reaching TMDB: ${networkErr && networkErr.message ? networkErr.message : String(networkErr)}`);
  }

  if(response.status === 429){
    if(attempt < 4){
      let waitMs = 1500 * Math.pow(2, attempt);
      try{
        const retryAfter = response.headers && response.headers.get && response.headers.get('retry-after');
        if(retryAfter) waitMs = Math.max(waitMs, parseFloat(retryAfter) * 1000);
      } catch(e){ /* headers not readable, fall back to computed wait */ }
      await sleep(waitMs);
      return tmdbRequest(url, attempt+1);
    }
    throw new Error('TMDB rate limit exceeded after retries');
  }

  if(!response.ok){
    let detail = '';
    try{ detail = (await readFullBody(response)).slice(0,200); } catch(e){}
    throw new Error(`TMDB request failed (HTTP ${response.status})${detail ? ': ' + detail : ''}`);
  }

  let bodyText;
  try{
    bodyText = await readFullBody(response);
  } catch(e){
    if(attempt < 2){ await sleep(800 * (attempt+1)); return tmdbRequest(url, attempt+1); }
    throw new Error('could not read the TMDB response');
  }

  if(!bodyText || !bodyText.trim()){
    if(attempt < 3){ await sleep(700 * Math.pow(2, attempt)); return tmdbRequest(url, attempt+1); }
    throw new Error(`TMDB returned a completely empty response body after retries`);
  }

  try{
    return JSON.parse(bodyText);
  } catch(e){
    if(attempt < 2){ await sleep(800 * (attempt+1)); return tmdbRequest(url, attempt+1); }
    throw new Error(`TMDB response was not valid JSON: ${bodyText.slice(0,150)}`);
  }
}

async function fetchOmdbRatings(item, imdbId, attempt){
  attempt = attempt || 0;
  let url;
  if(imdbId){
    url = `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&i=${encodeURIComponent(imdbId)}`;
  } else {
    const params = new URLSearchParams({ apikey: OMDB_API_KEY, t: item.title });
    if(item.year) params.set('y', String(item.year));
    url = `https://www.omdbapi.com/?${params.toString()}`;
  }

  let response;
  try{
    response = await fetch(url);
  } catch(networkErr){
    if(attempt < 2){ await sleep(1000 * Math.pow(2, attempt)); return fetchOmdbRatings(item, imdbId, attempt+1); }
    throw new Error(`network error reaching OMDb: ${networkErr && networkErr.message ? networkErr.message : String(networkErr)}`);
  }

  if(!response.ok){
    if(response.status >= 500 && attempt < 2){ await sleep(1000 * Math.pow(2, attempt)); return fetchOmdbRatings(item, imdbId, attempt+1); }
    throw new Error(`OMDb request failed (HTTP ${response.status})`);
  }

  let bodyText;
  try{ bodyText = await readFullBody(response); } catch(e){ throw new Error('could not read the OMDb response'); }

  let data;
  try{ data = JSON.parse(bodyText); } catch(e){ throw new Error(`OMDb response was not valid JSON: ${bodyText.slice(0,150)}`); }

  if(data.Response === 'False'){
    return { imdbRating:'', rottenTomatoesScore:'' };
  }

  const result = { imdbRating:'', rottenTomatoesScore:'' };
  if(data.imdbRating && data.imdbRating !== 'N/A'){
    result.imdbRating = `${data.imdbRating}/10`;
  }
  const rt = (data.Ratings || []).find(r => r.Source === 'Rotten Tomatoes');
  if(rt) result.rottenTomatoesScore = rt.Value;
  return result;
}

// TMDB lists every company that touched a film (financiers, effects houses, small
// production shingles) with no indication of which one is "the" studio — so prefer
// a recognizable major distributor when one is present, rather than just picking
// whichever company TMDB happened to list first.
const MAJOR_STUDIO_PATTERNS = [
  'Warner Bros', 'Universal', 'Paramount', 'Columbia Pictures', 'Sony Pictures',
  'Walt Disney', 'Disney', '20th Century', 'Lionsgate', 'Metro-Goldwyn-Mayer', 'MGM',
  'New Line Cinema', 'DreamWorks', 'Focus Features', 'Miramax', 'Pixar', 'Marvel Studios',
  'Lucasfilm', 'TriStar', 'Orion Pictures', 'United Artists', 'Searchlight',
  'Netflix', 'Amazon Studios', 'Amazon MGM', 'Apple Studios', 'Apple Original',
  'A24', 'Legendary Pictures', 'Blumhouse'
];
function pickStudio(companies){
  if(!companies || !companies.length) return '';
  // Check patterns in priority order (not company array order), so a major distributor
  // like Warner Bros. always wins over a secondary production company like Legendary
  // Pictures even if the production company happens to be listed first.
  for(const pattern of MAJOR_STUDIO_PATTERNS){
    const match = companies.find(c => c.name && c.name.toLowerCase().includes(pattern.toLowerCase()));
    if(match) return match.name;
  }
  return companies[0].name || '';
}

async function fetchTmdbDetails(item){
  const isTv = item.category === 'TV';
  const endpoint = isTv ? 'tv' : 'movie';
  const params = new URLSearchParams({ query: item.title });
  // Movies: TMDB's year filter is precise (release year), safe to apply directly.
  // TV: item.year usually reflects a particular season's air year, not the show's
  // original premiere year, so filtering by it could exclude the correct show entirely.
  if(item.year && !isTv){
    params.set('year', String(item.year));
  }
  const searchUrl = `https://api.themoviedb.org/3/search/${endpoint}?${params.toString()}`;
  const searchData = await tmdbRequest(searchUrl);
  const results = searchData.results || [];
  if(results.length === 0) return { coverUrl:'', overview:'', mpaRating:'', trailerUrl:'', director:'', cast:[], genre:[], runtime:'', episodeCount:'', studio:'', imdbRating:'', rottenTomatoesScore:'' };

  let best = results[0];
  if(item.year && !isTv){
    const yearMatch = results.find(r => r.release_date && parseInt(r.release_date.slice(0,4)) === item.year);
    if(yearMatch) best = yearMatch;
  }

  const result = {
    coverUrl: best.poster_path ? `${TMDB_IMAGE_BASE}${best.poster_path}` : '',
    overview: best.overview || '',
    mpaRating: '',
    trailerUrl: '',
    director: '',
    cast: [],
    genre: [],
    runtime: '',
    episodeCount: '',
    studio: '',
    imdbRating: '',
    rottenTomatoesScore: ''
  };

  if(!best.id) return result;

  await sleep(300);
  let movieImdbId = null;
  try{
    // credits and genres are only actually used for movies (per Movie's tmdbKeys), but
    // requesting them here costs nothing extra for TV since TV's config just won't read them
    const appendParam = isTv ? 'content_ratings,videos' : 'release_dates,videos,credits';
    const detailUrl = `https://api.themoviedb.org/3/${endpoint}/${best.id}?append_to_response=${appendParam}`;
    const detailData = await tmdbRequest(detailUrl);

    const videos = (detailData.videos && detailData.videos.results) || [];
    const trailer = videos.find(v => v.site === 'YouTube' && v.type === 'Trailer') || videos.find(v => v.site === 'YouTube');
    if(trailer) result.trailerUrl = `https://www.youtube.com/watch?v=${trailer.key}`;

    if(isTv){
      const ratings = (detailData.content_ratings && detailData.content_ratings.results) || [];
      const us = ratings.find(r => r.iso_3166_1 === 'US');
      if(us) result.mpaRating = us.rating || '';

      // Fallback "director" for TV: the show's credited creator(s). This gets
      // replaced below with actual season-specific episode directors when available.
      const creators = (detailData.created_by || []).map(c => c.name);
      if(creators.length) result.director = creators.join(', ');
    } else {
      const releaseDates = (detailData.release_dates && detailData.release_dates.results) || [];
      const us = releaseDates.find(r => r.iso_3166_1 === 'US');
      const certEntry = us && (us.release_dates || []).find(rd => rd.certification);
      if(certEntry) result.mpaRating = certEntry.certification || '';

      const crew = (detailData.credits && detailData.credits.crew) || [];
      const directors = crew.filter(c => c.job === 'Director').map(c => c.name);
      result.director = directors.join(', ');

      const castList = (detailData.credits && detailData.credits.cast) || [];
      result.cast = castList.slice(0, 5).map(c => c.name);

      result.genre = (detailData.genres || []).map(g => g.name);
      result.runtime = detailData.runtime || '';

      result.studio = pickStudio(detailData.production_companies);
      movieImdbId = detailData.imdb_id || null;
    }
  } catch(e){
    // cover art and overview already came from the search call, so this is a
    // partial-success case — leave the rest blank rather than fail the whole item
    console.error('TMDB detail lookup failed', e);
  }

  // Movies: IMDb and Rotten Tomatoes ratings come from OMDb, using the precise IMDb ID
  // from TMDB when we have it (falls back to a title/year search on OMDb otherwise).
  if(!isTv){
    try{
      const omdbResult = await fetchOmdbRatings(item, movieImdbId);
      result.imdbRating = omdbResult.imdbRating;
      result.rottenTomatoesScore = omdbResult.rottenTomatoesScore;
    } catch(e){
      console.error('OMDb lookup failed', e);
    }
  }

  // TV: the show-level overview/director above are generic — swap in the season-specific
  // synopsis, episode count, and episode directors/cast when we can tell which season this is.
  if(isTv){
    const seasonMatch = (item.season || '').match(/(\d+)/);
    const seasonNumber = seasonMatch ? parseInt(seasonMatch[1]) : null;
    if(seasonNumber !== null){
      await sleep(300);
      try{
        const seasonUrl = `https://api.themoviedb.org/3/tv/${best.id}/season/${seasonNumber}?append_to_response=credits`;
        const seasonData = await tmdbRequest(seasonUrl);
        if(seasonData.overview) result.overview = seasonData.overview;
        if(Array.isArray(seasonData.episodes)) result.episodeCount = seasonData.episodes.length;

        const crew = (seasonData.credits && seasonData.credits.crew) || [];
        const directors = [...new Set(crew.filter(c => c.job === 'Director').map(c => c.name))];
        if(directors.length) result.director = directors.join(', ');

        const castList = (seasonData.credits && seasonData.credits.cast) || [];
        if(castList.length) result.cast = castList.slice(0, 5).map(c => c.name);
      } catch(e){
        console.error('TMDB season lookup failed', e);
      }
    }
  }

  return result;
}

function isFieldFilled(item, config, key){
  const fieldDesc = config.fields.find(f => f.key === key);
  if(!fieldDesc) return false;
  return fieldDesc.type === 'tags'
    ? Array.isArray(item[key]) && item[key].length > 0
    : !!item[key];
}

async function fetchGoogleBooksDetails(item, attempt){
  attempt = attempt || 0;
  let query;
  if(item.isbn && item.isbn.trim()){
    query = `isbn:${item.isbn.trim().replace(/[\s-]/g, '')}`;
  } else {
    const parts = [`intitle:${item.title || ''}`];
    if(item.author) parts.push(`inauthor:${item.author}`);
    query = parts.join('+');
  }
  const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&key=${GOOGLE_BOOKS_API_KEY}`;

  let response;
  try{
    response = await fetch(url);
  } catch(networkErr){
    if(attempt < 2){ await sleep(1000 * Math.pow(2, attempt)); return fetchGoogleBooksDetails(item, attempt+1); }
    throw new Error(`network error reaching Google Books: ${networkErr && networkErr.message ? networkErr.message : String(networkErr)}`);
  }

  if(response.status === 429){
    slowDown();
    if(attempt < 4){
      let waitMs = 1500 * Math.pow(2, attempt);
      try{
        const retryAfter = response.headers && response.headers.get && response.headers.get('retry-after');
        if(retryAfter) waitMs = Math.max(waitMs, parseFloat(retryAfter) * 1000);
      } catch(e){ /* headers not readable, fall back to computed wait */ }
      await sleep(waitMs);
      return fetchGoogleBooksDetails(item, attempt+1);
    }
    throw new Error('Google Books rate limit exceeded after retries — wait a minute before scanning more books');
  }

  if(!response.ok){
    if(response.status >= 500 && attempt < 2){ await sleep(1000 * Math.pow(2, attempt)); return fetchGoogleBooksDetails(item, attempt+1); }
    throw new Error(`Google Books request failed (HTTP ${response.status})`);
  }
  speedUpSlightly();

  let bodyText;
  try{ bodyText = await readFullBody(response); } catch(e){ throw new Error('could not read the Google Books response'); }

  let data;
  try{ data = JSON.parse(bodyText); } catch(e){ throw new Error(`Google Books response was not valid JSON: ${bodyText.slice(0,150)}`); }

  const result = { title:'', year:'', author:'', publisher:'', genre:[], coverUrl:'', goodreadsRating:'', overview:'', pageCount:'' };
  const items = data.items || [];
  if(items.length === 0) return result;

  const info = items[0].volumeInfo || {};
  if(info.title) result.title = info.title;
  if(info.publishedDate) result.year = parseInt(info.publishedDate.slice(0,4)) || '';
  if(info.authors) result.author = info.authors.join(', ');
  if(info.publisher) result.publisher = info.publisher;
  if(info.categories) result.genre = info.categories;
  const googleThumb = info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail);
  if(info.averageRating) result.goodreadsRating = `${info.averageRating}/5`;
  if(info.description) result.overview = info.description;
  if(info.pageCount) result.pageCount = info.pageCount;

  // Open Library's cover images are noticeably less compressed/higher quality than
  // Google's thumbnails, so prefer it when this edition actually has one there —
  // otherwise fall back to Google's thumbnail so coverage stays as complete as before.
  let isbnForCover = item.isbn && item.isbn.trim() ? item.isbn.trim().replace(/[\s-]/g, '') : null;
  if(!isbnForCover && Array.isArray(info.industryIdentifiers)){
    const isbn13 = info.industryIdentifiers.find(id => id.type === 'ISBN_13');
    const isbn10 = info.industryIdentifiers.find(id => id.type === 'ISBN_10');
    const found = isbn13 || isbn10;
    if(found) isbnForCover = found.identifier;
  }

  if(isbnForCover){
    const openLibraryUrl = `https://covers.openlibrary.org/b/isbn/${isbnForCover}-L.jpg?default=false`;
    try{
      const headResponse = await fetch(openLibraryUrl, { method: 'HEAD' });
      if(headResponse.ok) result.coverUrl = openLibraryUrl;
    } catch(e){
      // couldn't even check — fall through to Google's thumbnail below
    }
  }
  if(!result.coverUrl && googleThumb){
    result.coverUrl = googleThumb.replace(/^http:/, 'https:');
  }

  return result;
}

async function fetchRawgDetails(item){
  const result = { developer:'', publisher:'', genre:[], coverUrl:'', metacriticRating:'', year:'' };

  const params = new URLSearchParams({ key: RAWG_API_KEY, search: item.title, page_size: '5' });
  const searchUrl = `https://api.rawg.io/api/games?${params.toString()}`;
  const searchData = await rawgRequest(searchUrl);
  const results = searchData.results || [];
  if(results.length === 0) return result;

  let best = results[0];
  if(item.year){
    const yearMatch = results.find(r => r.released && parseInt(r.released.slice(0,4)) === item.year);
    if(yearMatch) best = yearMatch;
  }
  result.coverUrl = best.background_image || '';
  result.genre = (best.genres || []).map(g => g.name);
  if(best.metacritic) result.metacriticRating = best.metacritic;
  if(best.released) result.year = parseInt(best.released.slice(0,4)) || '';

  if(!best.id) return result;

  await sleep(300);
  try{
    const detailUrl = `https://api.rawg.io/api/games/${best.id}?key=${RAWG_API_KEY}`;
    const detailData = await rawgRequest(detailUrl);
    if(Array.isArray(detailData.developers) && detailData.developers.length){
      result.developer = detailData.developers.map(d => d.name).join(', ');
    }
    if(Array.isArray(detailData.publishers) && detailData.publishers.length){
      result.publisher = detailData.publishers.map(p => p.name).join(', ');
    }
    if(!result.coverUrl && detailData.background_image) result.coverUrl = detailData.background_image;
  } catch(e){
    // search-level data (cover, genre, metacritic) already succeeded, so this is a
    // partial-success case — leave developer/publisher blank rather than fail the whole item
    console.error('RAWG detail lookup failed', e);
  }

  return result;
}

async function fetchItemDetails(item){
  const config = CATEGORY_CONFIG[item.category];
  const specialKeysAll = config.tmdbKeys || config.googleBooksKeys || config.rawgKeys || [];
  const neededKeys = config.enrichKeys.filter(k => !isFieldFilled(item, config, k));
  const neededSpecialKeys = specialKeysAll.filter(k => neededKeys.includes(k));
  const neededAiKeys = neededKeys.filter(k => !specialKeysAll.includes(k));
  const merged = {};

  if(neededSpecialKeys.length > 0){
    let specialResult;
    if(config.tmdbKeys) specialResult = await fetchTmdbDetails(item);
    else if(config.googleBooksKeys) specialResult = await fetchGoogleBooksDetails(item);
    else specialResult = await fetchRawgDetails(item);
    neededSpecialKeys.forEach(k => { if(k in specialResult) merged[k] = specialResult[k]; });
    await sleep(300);
  }

  const batches = getEnrichBatches(neededAiKeys);
  for(let i=0; i<batches.length; i++){
    const partial = await fetchFieldBatch(item, batches[i]);
    Object.assign(merged, partial);
    if(i < batches.length - 1) await sleep(300);
  }
  return merged;
}

function applyDetails(idx, details){
  const item = state.items[idx];
  const config = CATEGORY_CONFIG[item.category];
  const keys = config.enrichKeys.filter(k=>k!=='coverUrl');
  keys.forEach(k=>{
    const fieldDesc = config.fields.find(f=>f.key===k);
    const isTagsField = fieldDesc.type === 'tags';
    const alreadyHasValue = isTagsField
      ? Array.isArray(item[k]) && item[k].length > 0
      : !!item[k];
    if(alreadyHasValue) return; // never overwrite something already filled in — by hand or by an earlier lookup
    if(isTagsField){
      item[k] = Array.isArray(details[k]) ? details[k] : [];
    } else {
      item[k] = details[k] || '';
    }
  });
  if(!item.coverUrl && details.coverUrl) item.coverUrl = details.coverUrl;
  item.enriched = true;
}

let enrichStopped = false;

const ENRICH_BATCH_LIMIT = 12;
const ENRICH_CONSECUTIVE_FAIL_LIMIT = 3;

async function startEnrichment(){
  const allTodo = currentItems().filter(m=>!m.enriched);
  if(allTodo.length===0){ showToast('Everything is already filled in'); return; }
  const todo = allTodo.slice(0, ENRICH_BATCH_LIMIT);
  enrichStopped = false;
  state.enriching = true;
  state.enrichProgress = {done:0, total: todo.length};
  render();

  let failCount = 0;
  let consecutiveFails = 0;
  let circuitBroken = false;
  let lastErrorMessage = '';
  for(const item of todo){
    if(enrichStopped) break;
    try{
      const details = await fetchItemDetails(item);
      const idx = state.items.findIndex(m=>m.id===item.id);
      if(idx>-1) applyDetails(idx, details);
      consecutiveFails = 0;
    } catch(e){
      failCount++;
      consecutiveFails++;
      lastErrorMessage = (e && e.message) ? e.message : String(e);
      console.error('enrich failed for', item.title, e);
      if(consecutiveFails >= ENRICH_CONSECUTIVE_FAIL_LIMIT){
        circuitBroken = true;
      }
    }
    state.enrichProgress.done++;
    await saveLibrary();
    render();
    if(circuitBroken) break;
    if(!enrichStopped) await sleep(enrichDelayMs);
  }
  state.enriching = false;
  render();

  const stillRemaining = currentItems().filter(m=>!m.enriched).length;
  if(enrichStopped){
    showToast('Stopped — pick up again anytime');
  } else if(circuitBroken){
    showToast(`Paused after repeated failures — ${stillRemaining} left. Latest error: ${lastErrorMessage.slice(0,150)}`, 12000);
  } else if(stillRemaining > 0){
    showToast(`Filled in this batch (${failCount} needed a manual look) — ${stillRemaining} left. Latest error: ${lastErrorMessage.slice(0,150)}`, 10000);
  } else if(failCount > 0){
    showToast(`Done — ${failCount} needed a manual look. Latest error: ${lastErrorMessage.slice(0,150)}`, 10000);
  } else {
    showToast('Finished filling in your library');
  }
}

function stopEnrichment(){
  enrichStopped = true;
}

async function enrichOne(id){
  const item = state.items.find(m=>m.id===id);
  if(!item) return;
  const config = CATEGORY_CONFIG[item.category];
  const stillNeeded = config.enrichKeys.filter(k => !isFieldFilled(item, config, k));
  if(stillNeeded.length === 0){
    showToast('Every field here is already filled in');
    return;
  }
  showToast('Looking up details…');
  try{
    const details = await fetchItemDetails(item);
    const idx = state.items.findIndex(m=>m.id===id);
    applyDetails(idx, details);
    await saveLibrary();
    renderModal(state.items[idx]);
    render();
    showToast('Updated');
  } catch(e){
    showToast('Could not find details — try editing manually');
  }
}

function initHeaderScrollShrink(){
  window.addEventListener('scroll', () => {
    const shrink = window.scrollY > 40;
    const badge = document.getElementById('brandBadge');
    const icon = document.getElementById('brandIcon');
    const title = document.getElementById('brandTitle');
    const subtitle = document.getElementById('brandSubtitle');
    const divider = document.getElementById('brandDivider');
    const iconsRow = document.getElementById('brandIconsRow');
    if(!badge || !title) return;
    badge.style.width = shrink ? '40px' : '';
    badge.style.height = shrink ? '40px' : '';
    if(icon) icon.style.height = shrink ? '36px' : '';
    title.style.fontSize = shrink ? '20px' : '';
    if(subtitle) subtitle.style.display = shrink ? 'none' : '';
    if(divider) divider.style.display = shrink ? 'none' : '';
    if(iconsRow) iconsRow.style.display = shrink ? 'none' : '';
  });
}
